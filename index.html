<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e5e7df">
  <title>校园三年 · 风经过座位</title>
  <script>try{if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&localStorage.getItem('campus-opening-film-v10-seen')!=='yes'){document.documentElement.classList.add('opening-pending');setTimeout(()=>document.documentElement.classList.remove('opening-pending'),3500);}}catch{}</script>
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="experience.css?v=21-lunch"><link rel="stylesheet" href="identity.css?v=4-sweet">
  <link rel="stylesheet" href="opening.css?v=10-voiced">
  <link rel="stylesheet" href="prelude.css?v=20-letters">
  <link rel="stylesheet" href="weekend.css?v=11-weekends">
  <link rel="stylesheet" href="menu.css?v=16-growth">
<link rel="stylesheet" href="growth.css?v=16-growth">
<link rel="stylesheet" href="ambient.css?v=22-scenes">
<link rel="stylesheet" href="holiday.css?v=23-break">
<link rel="stylesheet" href="emotions.css?v=24-emotions">
</head>
<body>
<main id="game" class="at-title" aria-label="校园三年">
  <div id="world" class="world classroom" aria-hidden="true"></div>
  <div class="light-grain" aria-hidden="true"></div>
  <section id="title-screen" class="title-screen">
    <div class="title-copy">
      <p class="chapter-label">一段关于普通高中生活的游戏</p>
      <h1>校园三年</h1>
      <p class="title-sub">把高中，过成自己的样子</p>
      <div class="title-rule"></div>
      <p class="title-prose">九月的风把窗帘吹起来。<br>你找到自己的座位，<br>以为往后的日子还很长。</p>
      <nav class="title-actions" aria-label="主菜单">
        <button id="new-game" class="ink-button"><strong>新的开始</strong><small>随机成长起点，重新走进高中</small><span aria-hidden="true">↗</span></button>
        <button id="continue-game" class="quiet-button" disabled aria-describedby="title-save-summary"><strong>继续游戏</strong><small>还没有留下的进度</small></button>
        <button id="more-play" class="quiet-button"><strong>更多玩法</strong><small>情绪图鉴、假期与小游戏</small></button>
      </nav>
      <p id="title-save-summary" class="title-save-summary">从“新的开始”认识大家。</p>
      <p class="edition">成长重制版 · 课堂 / 自习 / 班级 / 成绩单</p>
    </div>
    <button id="prelude-preview" class="prelude-preview" aria-label="翻看青春片段"><img src="assets/prelude-sports-v19.jpg" alt="运动会后递来的水"><span><small>也许，会有这样一天</small><strong>五幕青春，慢慢翻。 ↗</strong></span></button>
    <div class="title-bottom"><span>把时间留给值得的人和事。</span><div><button id="title-help" class="text-button">怎么玩</button><button id="opening-replay" class="text-button opening-replay">重看配音开场 · 21 秒</button></div></div>
  </section>
  <section id="play-screen" class="play-screen" hidden>
    <header class="topbar">
      <div class="brand"><span class="brand-name">校园三年</span><button id="profile-button" class="profile-chip" aria-label="查看主角身份"><img id="profile-avatar" alt="主角头像"><span id="profile-name">你的名字</span></button></div>
      <div class="date-block"><span id="date-label"></span><span id="week-label"></span></div>
      <div class="tools"><button id="sound-button" class="icon-button" aria-label="关闭背景音乐" title="背景音乐">乐</button><button id="journal-button" class="icon-button" aria-label="打开手记" title="手记">记</button><button id="menu-button" class="icon-button" aria-label="暂停菜单" title="暂停菜单">···</button></div>
    </header>
    <div class="scene-heading"><div class="scene-title-row"><span class="small-line"></span><h2 id="scene-name"></h2></div><p id="scene-desc"></p></div>
    <div class="time-budget" aria-label="本周剩余时间"><span>课余时间</span><div id="time-dots"></div><strong id="time-label"></strong></div>
    <aside class="energy-budget" id="energy-budget" aria-label="当前精力"><header><span>精力</span><strong id="energy-number">64 / 100</strong></header><div class="energy-track" role="meter" aria-label="精力" aria-valuemin="0" aria-valuemax="100" aria-valuenow="64"><i id="energy-fill"></i></div><small id="energy-hint">学习也需要留一点余力</small></aside>
    <div id="hotspots" class="hotspots" aria-label="场景中的人物与物品"></div>
    <section id="weekend-screen" class="weekend-screen" aria-label="周末的安排" hidden></section>
    <aside id="reminder" class="reminder" hidden></aside>
    <div id="observation" class="observation" role="status"></div>
    <footer class="bottom-bar">
      <nav aria-label="校园地点"><button data-place="classroom" class="place-button"><span class="nav-icon" data-icon="school"></span><span>教室</span></button><button data-place="canteen" class="place-button"><span class="nav-icon" data-icon="bowl"></span><span>食堂</span></button><button data-place="track" class="place-button"><span class="nav-icon">↝</span><span>操场</span></button><button data-place="home" class="place-button"><span class="nav-icon" data-icon="home"></span><span>家里</span></button></nav>
      <button id="plan-button" class="plan-button"><span data-icon="calendar"></span><span>这一周的安排</span></button>
      <button id="finish-week" class="finish-button">收好这一周 <span aria-hidden="true">→</span></button>
    </footer>
    <div id="save-indicator" class="save-indicator" role="status"></div>
  </section>
  <div id="overlay-root"></div>
  <div id="toast" class="toast" role="status" hidden></div>
</main>

<script src="ambient.js?v=22-scenes"></script>

<script src="game.js?v=26-natural-turn"></script>
<script src="opening-film.js?v=5-opening"></script>
<script src="opening.js?v=12-rhythm"></script>
</body>
</html>
